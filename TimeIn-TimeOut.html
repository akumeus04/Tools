<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time-in / Time-out - TIMECHECK</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-red: #DA291C;
      --brand-dark: #272727;
      --bg-color: #f6f6f7;
      --card-bg: #ffffff;
      --text-main: #000000;
      --text-muted: #888888;
      --border-light: #e3e3e3;
      --input-bg: #fafafa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    /* ── Dashboard Stats Card Base ── */
    .tc-card {
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 380px;
    }

    /* ── Dark Clock Card ── */
    .clock-card {
      background: var(--brand-dark);
      color: #ffffff;
      align-items: center;
      text-align: center;
    }

    canvas#clockFace { display: block; margin: 0 auto; }

    .digital-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .digital-time {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .digital-ampm {
      font-size: 13px;
      color: #aaaaaa;
      font-weight: 600;
    }
    .digital-date {
      font-size: 11px;
      color: #aaaaaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── White Config Card ── */
    .config-card {
      background: var(--card-bg);
      justify-content: flex-start;
      gap: 16px;
    }

    .section-label {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .field label {
      font-size: 12px;
      font-weight: 600;
      color: #555555;
    }
    .field input {
      height: 46px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      background: var(--input-bg);
      color: #222222;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--brand-red);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(218, 41, 28, 0.12);
    }
    .field input:disabled {
      background: #f1f1f1;
      color: #999999;
      cursor: not-allowed;
      border-color: #efefef;
    }

    /* ── Red Result Card ── */
    .result-card {
      background: var(--brand-red);
      color: #ffffff;
    }
    .result-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .result-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }
    .result-value {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      margin-top: 4px;
    }
    .result-military {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
    }
    .result-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 16px;
      margin-top: auto;
    }
    .result-tag {
      font-size: 12px;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    /* Responsive layout */
    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
        max-width: 420px;
      }
      .tc-card {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- 1. Clock Card -->
  <div class="tc-card clock-card">
    <canvas id="clockFace" width="180" height="180"></canvas>
    <div>
      <div class="digital-row">
        <span class="digital-time" id="dTime">--:--:--</span>
        <span class="digital-ampm" id="dAmPm">--</span>
      </div>
      <div class="digital-date" id="dDate">--</div>
    </div>
  </div>

  <!-- 2. Shift Configuration Card -->
  <div class="tc-card config-card">
    <div class="section-label">Shift Configuration</div>
    <div class="field">
      <label for="timeInput">Time-in</label>
      <input id="timeInput" type="time" value="08:45" />
    </div>
    <div class="field">
      <label>Shift Duration</label>
      <input type="text" value="+8 hrs" disabled />
    </div>
    <div class="field">
      <label for="breakMin">Break (minutes)</label>
      <input id="breakMin" type="number" value="30" min="0" max="120" />
    </div>
  </div>

  <!-- 3. Result Card -->
  <div class="tc-card result-card">
    <div class="result-content">
      <div class="result-label">Expected Time-out</div>
      <div class="result-value" id="resValue">--:-- --</div>
      <div class="result-military" id="resMil"></div>
    </div>
    <div class="result-row">
      <span class="result-tag" id="resDuration"></span>
      <span class="result-tag" id="resStatus" style="font-weight: 600;"></span>
    </div>
  </div>

</div>

<script>
  /* ── Analog Clock ── */
  const canvas = document.getElementById('clockFace');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, R = W / 2;

  function drawClock() {
    const now = new Date();
    const sec = now.getSeconds();
    const min = now.getMinutes();
    const hr  = now.getHours() % 12;
    const ms  = now.getMilliseconds();

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(R, R);

    // Face
    ctx.beginPath();
    ctx.arc(0, 0, R - 2, 0, Math.PI * 2);
    ctx.fillStyle = '#272727';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Inner ring
    ctx.beginPath();
    ctx.arc(0, 0, R - 6, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Ticks
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const isMajor = i % 5 === 0;
      const outer = R - 10;
      const inner = isMajor ? R - 18 : R - 14;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
      ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
      ctx.strokeStyle = isMajor ? '#aaaaaa' : '#555555';
      ctx.lineWidth = isMajor ? 1.5 : 1;
      ctx.stroke();
    }

    // Hour numbers
    ctx.fillStyle = '#ffffff';
    ctx.font = '500 10px Poppins, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 1; i <= 12; i++) {
      const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const nr = R - 28;
      ctx.fillText(i, Math.cos(angle) * nr, Math.sin(angle) * nr);
    }

    // Hand helper
    function hand(angle, length, width, color) {
      ctx.save();
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, length * 0.2);
      ctx.lineTo(0, -length);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    }

    const secAngle = ((sec + ms / 1000) / 60) * Math.PI * 2 - Math.PI / 2;
    const minAngle = ((min + sec / 60) / 60) * Math.PI * 2 - Math.PI / 2;
    const hrAngle  = ((hr + min / 60) / 12) * Math.PI * 2 - Math.PI / 2;

    hand(hrAngle,  R * 0.48, 3, '#ffffff');
    hand(minAngle, R * 0.62, 2.5, '#aaaaaa');
    hand(secAngle, R * 0.70, 1.5, '#DA291C');

    // Center cap
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#DA291C';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.restore();

    // Digital readout
    const dStr = now.toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
    });
    const parts = dStr.split(' ');
    document.getElementById('dTime').textContent = parts[0];
    document.getElementById('dAmPm').textContent = parts[1] || '';

    const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('dDate').textContent =
      `${days[now.getDay()]}  ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
  }

  /* ── LocalStorage Operations ── */
  function loadSavedInputs() {
    const savedTime = localStorage.getItem('tc_timeInput');
    const savedBreak = localStorage.getItem('tc_breakMin');

    if (savedTime !== null) {
      document.getElementById('timeInput').value = savedTime;
    }
    if (savedBreak !== null) {
      document.getElementById('breakMin').value = savedBreak;
    }
  }

  function saveInputs() {
    const timeVal = document.getElementById('timeInput').value;
    const breakVal = document.getElementById('breakMin').value;

    localStorage.setItem('tc_timeInput', timeVal);
    localStorage.setItem('tc_breakMin', breakVal);
  }

  /* ── Calculation Engine ── */
  function calculate() {
    const t   = document.getElementById('timeInput').value;
    const brk = parseInt(document.getElementById('breakMin').value) || 0;
    
    saveInputs();

    if (!t) return;

    const [hh, mm] = t.split(':').map(Number);
    let total = (hh * 60) + mm + 480 + brk;
    total = ((total % 1440) + 1440) % 1440;

    const rH = Math.floor(total / 60);
    const rM = total % 60;
    const ap = rH >= 12 ? 'PM' : 'AM';
    const dH = rH % 12 || 12;
    const dM = String(rM).padStart(2, '0');

    document.getElementById('resValue').textContent  = `${dH}:${dM} ${ap}`;
    document.getElementById('resMil').textContent    = `24-Hour: ${String(rH).padStart(2,'0')}:${dM}`;
    document.getElementById('resDuration').textContent = `Shift: 8h 00m + ${brk}m break`;

    const now    = new Date();
    const outMin = rH * 60 + rM;
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const diff   = outMin - nowMin;

    let status = '';
    if (diff > 0)       status = `Status: ${Math.floor(diff / 60)}h ${diff % 60}m remaining`;
    else if (diff < 0)  status = `Status: ${Math.abs(Math.floor(diff / 60))}h ${Math.abs(diff % 60)}m overtime`;
    else                status = 'Status: Ready to clock out';

    document.getElementById('resStatus').textContent = status;
  }

  /* ── Init ── */
  setInterval(drawClock, 50);
  drawClock();

  loadSavedInputs();
  calculate();

  document.getElementById('timeInput').addEventListener('input', calculate);
  document.getElementById('breakMin').addEventListener('input', calculate);
</script>
</body>
</html>
