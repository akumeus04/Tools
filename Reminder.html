<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #EEF2FF;
            min-height: 100vh;
            display: flex; align-items: flex-start; justify-content: center;
            padding: 32px 16px 80px;
        }
        .container { width: 100%; max-width: 480px; }

        /* ── Header ── */
        .app-header { text-align: center; margin-bottom: 24px; }
        .app-header .logo {
            display: inline-flex; align-items: center; justify-content: center;
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #7C3AED, #4F46E5);
            border-radius: 16px; margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(124,58,237,0.35);
        }
        .app-header .logo svg { width: 28px; height: 28px; }
        .app-header h1 { font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 700; color: #1E1B4B; letter-spacing: -0.5px; }
        .app-header p  { font-size: 0.85rem; color: #6B7280; margin-top: 4px; }

        /* ── Tabs ── */
        .tabs {
            display: flex; gap: 6px; background: #fff; border-radius: 14px; padding: 5px;
            box-shadow: 0 2px 12px rgba(30,27,75,0.08); margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1; padding: 10px 8px; border: none; border-radius: 10px; cursor: pointer;
            font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
            color: #9CA3AF; background: transparent;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.18s ease;
        }
        .tab-btn.active { background: linear-gradient(135deg, #7C3AED, #4F46E5); color: #fff; box-shadow: 0 4px 12px rgba(124,58,237,0.3); }
        .tab-btn .badge { background: rgba(255,255,255,0.3); color: #fff; border-radius: 20px; padding: 1px 7px; font-size: 0.72rem; }
        .tab-btn:not(.active) .badge { background: #EEF2FF; color: #7C3AED; }

        /* ── Card ── */
        .card { background: #fff; border-radius: 20px; padding: 28px 24px; box-shadow: 0 4px 32px rgba(30,27,75,0.10); }

        /* ── Category Strip ── */
        .category-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #9CA3AF; margin-bottom: 10px; }
        .category-strip { display: flex; gap: 10px; margin-bottom: 22px; }
        .cat-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 12px 4px 10px; border: 2px solid #E5E7EB; border-radius: 14px;
            background: #F9FAFB; cursor: pointer; transition: all 0.18s ease; font-family: 'Inter', sans-serif;
        }
        .cat-btn span.icon { font-size: 1.5rem; line-height: 1; }
        .cat-btn span.label { font-size: 0.65rem; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.05em; }
        .cat-btn:hover { border-color: #C4B5FD; background: #F5F3FF; }
        .cat-btn.active { border-color: #7C3AED; background: #F5F3FF; box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
        .cat-btn.active span.label { color: #7C3AED; }
        #category, #editCategory { display: none; }

        /* ── Divider ── */
        .divider { border: none; border-top: 1px solid #F3F4F6; margin: 4px 0 22px; }

        /* ── Form ── */
        .form-group { margin-bottom: 18px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
        label {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.78rem; font-weight: 600; color: #374151;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;
        }
        label .licon { font-size: 0.95rem; }
        input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
            width: 100%; padding: 11px 14px; border: 1.5px solid #E5E7EB; border-radius: 10px;
            font-family: 'Inter', sans-serif; font-size: 0.92rem; color: #1F2937;
            background: #FAFAFA; transition: border-color 0.15s, box-shadow 0.15s;
            outline: none; appearance: none; -webkit-appearance: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #7C3AED; background: #fff; box-shadow: 0 0 0 3px rgba(124,58,237,0.12); }
        textarea { resize: vertical; min-height: 80px; }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #7C3AED; pointer-events: none; font-size: 0.85rem; }
        .select-wrapper select { padding-right: 32px; }
        #customDaysDiv, #editCustomDaysDiv { display: none; margin-top: 12px; animation: slideDown 0.2s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Buttons ── */
        .btn-submit {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #7C3AED, #4F46E5);
            color: #fff; border: none; border-radius: 12px;
            font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(124,58,237,0.35); margin-top: 6px;
        }
        .btn-submit:hover:not(:disabled) { opacity: 0.93; transform: translateY(-1px); box-shadow: 0 10px 28px rgba(124,58,237,0.40); }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        /* ── List Panel ── */
        #listPanel { display: none; }
        .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .list-header h2 { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 700; color: #1E1B4B; }
        .btn-refresh {
            display: flex; align-items: center; gap: 5px; padding: 7px 12px;
            border: 1.5px solid #DDD6FE; border-radius: 8px; background: #F5F3FF;
            color: #7C3AED; font-size: 0.78rem; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: all 0.15s;
        }
        .btn-refresh:hover { background: #EDE9FE; }
        .btn-refresh.spinning span { display: inline-block; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Cloud status indicator ── */
        .cloud-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.75rem; font-weight: 600; padding: 5px 10px;
            border-radius: 20px; margin-bottom: 14px;
        }
        .cloud-status.ok     { background: #F0FDF4; color: #16A34A; }
        .cloud-status.error  { background: #FEF2F2; color: #DC2626; }
        .cloud-status.loading{ background: #F5F3FF; color: #7C3AED; }
        .cloud-status.nourl  { background: #FFF7ED; color: #EA580C; }

        /* Filter chips */
        .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
        .chip { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; border: 1.5px solid #E5E7EB; background: #F9FAFB; color: #6B7280; cursor: pointer; transition: all 0.15s; }
        .chip.active { border-color: #7C3AED; background: #F5F3FF; color: #7C3AED; }

        /* Empty & loading states */
        .empty-state { text-align: center; padding: 40px 20px; color: #9CA3AF; }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { font-size: 0.9rem; }
        .skeleton-item { border-radius: 14px; background: #F3F4F6; height: 82px; margin-bottom: 10px; animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        /* Reminder item */
        .reminder-item { border: 1.5px solid #F3F4F6; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: #FAFAFA; transition: box-shadow 0.15s; cursor: pointer; }
        .reminder-item:hover { box-shadow: 0 4px 16px rgba(124,58,237,0.10); border-color: #DDD6FE; }
        .reminder-item.status-done { opacity: 0.55; }
        .reminder-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .reminder-item-left { display: flex; align-items: flex-start; gap: 12px; }
        .reminder-cat-icon { font-size: 1.6rem; flex-shrink: 0; margin-top: 1px; }
        .reminder-title { font-weight: 600; font-size: 0.95rem; color: #1F2937; margin-bottom: 3px; }
        .reminder-meta  { font-size: 0.78rem; color: #6B7280; display: flex; align-items: center; gap: 4px; }
        .reminder-badges { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .r-badge { font-size: 0.68rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: #EEF2FF; color: #4F46E5; }
        .r-badge.freq { background: #F0FDF4; color: #16A34A; }
        .r-badge.loc  { background: #FFF7ED; color: #EA580C; }
        .r-badge.done { background: #F3F4F6; color: #9CA3AF; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; transition: all 0.15s; }
        .icon-btn.edit { background: #EEF2FF; color: #4F46E5; }
        .icon-btn.edit:hover { background: #DDD6FE; }
        .icon-btn.del  { background: #FEF2F2; color: #DC2626; }
        .icon-btn.del:hover  { background: #FEE2E2; }

        /* ── Modals ── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(30,27,75,0.45); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal { background: #fff; border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(30,27,75,0.25); animation: modalIn 0.22s ease; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .modal-header h3 { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 700; color: #1E1B4B; }
        .modal-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: #F3F4F6; cursor: pointer; font-size: 1rem; color: #6B7280; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: #E5E7EB; }
        .detail-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #F3F4F6; }
        .detail-row:last-child { border-bottom: none; }
        .detail-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
        .detail-key { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #9CA3AF; }
        .detail-val { font-size: 0.92rem; color: #1F2937; margin-top: 2px; font-weight: 500; }
        .delete-confirm { text-align: center; padding: 10px 0; }
        .delete-confirm .del-icon { font-size: 3rem; margin-bottom: 12px; }
        .delete-confirm h3 { font-family: 'Poppins', sans-serif; font-size: 1.1rem; color: #1E1B4B; margin-bottom: 8px; }
        .delete-confirm p { font-size: 0.87rem; color: #6B7280; margin-bottom: 24px; }
        .btn-row { display: flex; gap: 10px; }
        .btn-cancel { flex: 1; padding: 12px; border: 1.5px solid #E5E7EB; border-radius: 10px; background: #fff; color: #374151; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .btn-cancel:hover { background: #F9FAFB; }
        .btn-danger { flex: 1; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg, #EF4444, #DC2626); color: #fff; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
        .btn-danger:hover { opacity: 0.9; }

        /* ── Toast ── */
        #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1E1B4B; color: #fff; padding: 12px 22px; border-radius: 50px; font-size: 0.87rem; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.3s; opacity: 0; z-index: 999; white-space: nowrap; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="app-header">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </div>
        <h1>Reminders</h1>
        <p>Set it once, never forget it again</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tabCreate" onclick="switchTab('create')">➕ Create</button>
        <button class="tab-btn" id="tabList" onclick="switchTab('list')">
            📋 My Reminders <span class="badge" id="reminderCount">0</span>
        </button>
    </div>

    <!-- ══ CREATE PANEL ══ -->
    <div id="createPanel">
        <div class="card">
            <div class="category-label">What kind of reminder?</div>
            <div class="category-strip">
                <button type="button" class="cat-btn active" data-value="medicine" onclick="selectCategory(this,'category')"><span class="icon">💊</span><span class="label">Medicine</span></button>
                <button type="button" class="cat-btn" data-value="birthday"  onclick="selectCategory(this,'category')"><span class="icon">🎂</span><span class="label">Birthday</span></button>
                <button type="button" class="cat-btn" data-value="event"     onclick="selectCategory(this,'category')"><span class="icon">📅</span><span class="label">Event</span></button>
                <button type="button" class="cat-btn" data-value="note"      onclick="selectCategory(this,'category')"><span class="icon">📝</span><span class="label">Note</span></button>
            </div>
            <select id="category"></select>
            <hr class="divider">
            <div class="form-group">
                <label for="title"><span class="licon">✏️</span> Title</label>
                <input type="text" id="title" placeholder="What should we remind you about?">
            </div>
            <div class="form-group">
                <label for="frequency"><span class="licon">🔁</span> Frequency</label>
                <div class="select-wrapper">
                    <select id="frequency" onchange="toggleCustomDays('customDaysDiv','customDays','frequency')">
                        <option value="none">One Time Only</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="custom">Custom (Every X Days)</option>
                    </select>
                </div>
                <div id="customDaysDiv">
                    <label for="customDays" style="margin-top:10px;"><span class="licon">🔢</span> Repeat Every</label>
                    <input type="number" id="customDays" min="2" placeholder="e.g., 3 (every 3 days)">
                </div>
            </div>
            <div class="form-row">
                <div><label for="date"><span class="licon">📆</span> Date</label><input type="date" id="date"></div>
                <div><label for="time"><span class="licon">⏰</span> Time</label><input type="time" id="time"></div>
            </div>
            <div class="form-group">
                <label for="location"><span class="licon">📍</span> Location <span style="font-weight:400;color:#9CA3AF;text-transform:none;letter-spacing:0;">(optional)</span></label>
                <input type="text" id="location" placeholder="Add a place">
            </div>
            <div class="form-group">
                <label for="notes"><span class="licon">💬</span> Notes</label>
                <textarea id="notes" placeholder="Any extra details..."></textarea>
            </div>
            <button class="btn-submit" id="submitBtn" onclick="saveReminder()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Save Reminder
            </button>
        </div>
    </div>

    <!-- ══ LIST PANEL ══ -->
    <div id="listPanel">
        <div class="card">
            <div class="list-header">
                <h2>📋 All Reminders</h2>
                <button class="btn-refresh" id="refreshBtn" onclick="loadFromCloud()"><span>☁️</span> Refresh</button>
            </div>
            <div id="cloudStatus"></div>
            <div class="filter-chips">
                <span class="chip active" data-filter="all"      onclick="setFilter(this)">All</span>
                <span class="chip"        data-filter="medicine" onclick="setFilter(this)">💊 Medicine</span>
                <span class="chip"        data-filter="birthday" onclick="setFilter(this)">🎂 Birthday</span>
                <span class="chip"        data-filter="event"    onclick="setFilter(this)">📅 Event</span>
                <span class="chip"        data-filter="note"     onclick="setFilter(this)">📝 Note</span>
            </div>
            <div id="remindersList"></div>
        </div>
    </div>
</div>

<!-- ══ VIEW MODAL ══ -->
<div class="modal-overlay" id="viewModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="viewModalTitle">Reminder Details</h3>
            <button class="modal-close" onclick="closeModal('viewModal')">✕</button>
        </div>
        <div id="viewModalBody"></div>
        <br>
        <div class="btn-row">
            <button class="btn-cancel" onclick="closeModal('viewModal')">Close</button>
            <button class="btn-submit" style="flex:1;margin-top:0;" onclick="editFromView()">✏️ Edit</button>
        </div>
    </div>
</div>

<!-- ══ EDIT MODAL ══ -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <h3>✏️ Edit Reminder</h3>
            <button class="modal-close" onclick="closeModal('editModal')">✕</button>
        </div>
        <div class="category-label">Category</div>
        <div class="category-strip">
            <button type="button" class="cat-btn active" data-value="medicine" onclick="selectCategory(this,'editCategory')"><span class="icon">💊</span><span class="label">Medicine</span></button>
            <button type="button" class="cat-btn" data-value="birthday"  onclick="selectCategory(this,'editCategory')"><span class="icon">🎂</span><span class="label">Birthday</span></button>
            <button type="button" class="cat-btn" data-value="event"     onclick="selectCategory(this,'editCategory')"><span class="icon">📅</span><span class="label">Event</span></button>
            <button type="button" class="cat-btn" data-value="note"      onclick="selectCategory(this,'editCategory')"><span class="icon">📝</span><span class="label">Note</span></button>
        </div>
        <select id="editCategory"></select>
        <hr class="divider">
        <div class="form-group">
            <label><span class="licon">✏️</span> Title</label>
            <input type="text" id="editTitle" placeholder="Title">
        </div>
        <div class="form-group">
            <label><span class="licon">🔁</span> Frequency</label>
            <div class="select-wrapper">
                <select id="editFrequency" onchange="toggleCustomDays('editCustomDaysDiv','editCustomDays','editFrequency')">
                    <option value="none">One Time Only</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="custom">Custom (Every X Days)</option>
                </select>
            </div>
            <div id="editCustomDaysDiv">
                <label style="margin-top:10px;"><span class="licon">🔢</span> Repeat Every</label>
                <input type="number" id="editCustomDays" min="2" placeholder="e.g., 3">
            </div>
        </div>
        <div class="form-row">
            <div><label><span class="licon">📆</span> Date</label><input type="date" id="editDate"></div>
            <div><label><span class="licon">⏰</span> Time</label><input type="time" id="editTime"></div>
        </div>
        <div class="form-group">
            <label><span class="licon">📍</span> Location</label>
            <input type="text" id="editLocation" placeholder="Add a place">
        </div>
        <div class="form-group">
            <label><span class="licon">💬</span> Notes</label>
            <textarea id="editNotes" placeholder="Any extra details..."></textarea>
        </div>
        <div class="btn-row">
            <button class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
            <button class="btn-submit" style="flex:1;margin-top:0;" id="updateBtn" onclick="updateReminder()">💾 Save Changes</button>
        </div>
    </div>
</div>

<!-- ══ DELETE MODAL ══ -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <div class="delete-confirm">
            <div class="del-icon">🗑️</div>
            <h3>Delete Reminder?</h3>
            <p id="deleteModalMsg">This cannot be undone.</p>
            <div class="btn-row">
                <button class="btn-cancel" onclick="closeModal('deleteModal')">Keep It</button>
                <button class="btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Yes, Delete</button>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
//  CONFIG — paste your deployed GAS Web App URL here
// ══════════════════════════════════════════
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxrGeLFjB0dtmoIbiXUX0oDfxiEHBSjWuYAOcqwu3CqeobIJjdyp4VqffjQ98-hRNnC6A/exec';   // e.g. 'https://script.google.com/macros/s/XXXXX/exec'

// ══════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════
const STORAGE_KEY  = 'jfcm_reminders';
const CAT_ICONS    = { medicine:'💊', birthday:'🎂', event:'📅', note:'📝' };
const CAT_LABELS   = { medicine:'Medicine', birthday:'Birthday', event:'Event', note:'Note' };
const FREQ_LABELS  = { none:'One Time Only', daily:'Daily', weekly:'Weekly', monthly:'Monthly', custom:'Custom' };

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let reminders    = [];
let currentFilter= 'all';
let editingId    = null;
let deletingId   = null;
let viewingId    = null;

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
function init() {
    // Start with localStorage cache for instant display
    reminders = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    updateBadge();
}

// ══════════════════════════════════════════
//  TAB SWITCHING
// ══════════════════════════════════════════
function switchTab(tab) {
    const isCreate = tab === 'create';
    document.getElementById('createPanel').style.display = isCreate ? '' : 'none';
    document.getElementById('listPanel').style.display   = isCreate ? 'none' : '';
    document.getElementById('tabCreate').classList.toggle('active',  isCreate);
    document.getElementById('tabList').classList.toggle('active',   !isCreate);
    if (!isCreate) loadFromCloud();
}

// ══════════════════════════════════════════
//  CLOUD: LOAD (GET ALL)
// ══════════════════════════════════════════
function loadFromCloud() {
    if (!WEB_APP_URL) {
        setCloudStatus('nourl', '⚠️ No Web App URL set — showing local data only');
        renderList();
        return;
    }

    setCloudStatus('loading', '☁️ Loading from Google Sheets…');
    setRefreshSpinning(true);

    fetch(`${WEB_APP_URL}?action=getAll`)
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                reminders = data.reminders;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
                updateBadge();
                setCloudStatus('ok', `✅ ${reminders.length} reminder${reminders.length !== 1 ? 's' : ''} loaded from Google Sheets`);
                renderList();
            } else {
                throw new Error(data.message || 'Unknown error');
            }
        })
        .catch(err => {
            // Fall back to localStorage
            reminders = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            setCloudStatus('error', '⚠️ Could not reach Google Sheets — showing local cache');
            renderList();
        })
        .finally(() => setRefreshSpinning(false));
}

function setCloudStatus(type, msg) {
    const el = document.getElementById('cloudStatus');
    el.innerHTML = `<div class="cloud-status ${type}">${msg}</div>`;
}
function setRefreshSpinning(on) {
    document.getElementById('refreshBtn').classList.toggle('spinning', on);
}

// ══════════════════════════════════════════
//  CLOUD: CREATE (POST)
// ══════════════════════════════════════════
function saveReminder() {
    const title      = document.getElementById('title').value.trim();
    const date       = document.getElementById('date').value;
    const time       = document.getElementById('time').value;
    const frequency  = document.getElementById('frequency').value;
    const customDays = document.getElementById('customDays').value;

    if (!title) { showToast('Please add a title.', false); return; }
    if (!date)  { showToast('Please pick a date.', false); return; }
    if (!time)  { showToast('Please pick a time.', false); return; }
    if (frequency === 'custom' && (!customDays || parseInt(customDays) < 2)) {
        showToast('Enter a valid number of days (min 2).', false); return;
    }

    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '⏳ Saving…'; btn.disabled = true;

    const reminder = {
        id:         Date.now().toString(),
        title,
        category:   document.getElementById('category').value || 'medicine',
        frequency,
        customDays: frequency === 'custom' ? parseInt(customDays) : 0,
        date, time,
        location:   document.getElementById('location').value.trim(),
        notes:      document.getElementById('notes').value.trim()
    };

    // Optimistic: add to local immediately
    reminders.push(reminder);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
    updateBadge();

    const resetBtn = () => {
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Reminder';
        btn.disabled = false;
    };

    if (!WEB_APP_URL) {
        showToast('Saved locally (no URL set).', true);
        resetForm(); resetBtn(); return;
    }

    fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(reminder) })
        .then(r => r.json())
        .then(data => {
            showToast(data.status === 'success' ? '✅ Saved to Google Sheets!' : '⚠️ Saved locally only.');
        })
        .catch(() => {
            // GAS CORS block on success is normal — treat as OK
            showToast('✅ Saved to Google Sheets!');
        })
        .finally(() => { resetForm(); resetBtn(); });
}

// ══════════════════════════════════════════
//  CLOUD: UPDATE (GET with ?action=update)
// ══════════════════════════════════════════
function updateReminder() {
    const title      = document.getElementById('editTitle').value.trim();
    const date       = document.getElementById('editDate').value;
    const time       = document.getElementById('editTime').value;
    const frequency  = document.getElementById('editFrequency').value;
    const customDays = document.getElementById('editCustomDays').value;

    if (!title) { showToast('Please add a title.', false); return; }
    if (!date)  { showToast('Please pick a date.', false); return; }
    if (!time)  { showToast('Please pick a time.', false); return; }
    if (frequency === 'custom' && (!customDays || parseInt(customDays) < 2)) {
        showToast('Enter a valid number of days (min 2).', false); return;
    }

    const updated = {
        id:         editingId,
        title,
        category:   document.getElementById('editCategory').value || 'medicine',
        frequency,
        customDays: frequency === 'custom' ? parseInt(customDays) : 0,
        date, time,
        location:   document.getElementById('editLocation').value.trim(),
        notes:      document.getElementById('editNotes').value.trim()
    };

    const btn = document.getElementById('updateBtn');
    btn.innerHTML = '⏳ Saving…'; btn.disabled = true;

    // Update local cache
    const idx = reminders.findIndex(x => x.id === editingId);
    if (idx !== -1) { reminders[idx] = { ...reminders[idx], ...updated }; }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));

    const finish = (msg) => {
        closeModal('editModal');
        renderList();
        showToast(msg);
        btn.innerHTML = '💾 Save Changes'; btn.disabled = false;
    };

    if (!WEB_APP_URL) { finish('Updated locally (no URL set).'); return; }

    // Build query string for GAS doGet update
    const params = new URLSearchParams({
        action:     'update',
        id:         updated.id,
        title:      updated.title,
        category:   updated.category,
        frequency:  updated.frequency,
        customDays: updated.customDays,
        date:       updated.date,
        time:       updated.time,
        location:   updated.location,
        notes:      updated.notes
    });

    fetch(`${WEB_APP_URL}?${params.toString()}`)
        .then(r => r.json())
        .then(data => finish(data.status === 'success' ? '✅ Updated in Google Sheets!' : '⚠️ Updated locally only.'))
        .catch(() => finish('✅ Updated in Google Sheets!'));
}

// ══════════════════════════════════════════
//  CLOUD: DELETE (GET with ?action=delete)
// ══════════════════════════════════════════
function openDelete(id) {
    const r = reminders.find(x => x.id === id);
    if (!r) return;
    deletingId = id;
    document.getElementById('deleteModalMsg').textContent = `"${r.title}" will be permanently removed.`;
    openModal('deleteModal');
}

function confirmDelete() {
    const btn = document.getElementById('confirmDeleteBtn');
    btn.textContent = 'Deleting…'; btn.disabled = true;

    // Remove from local cache
    reminders = reminders.filter(x => x.id !== deletingId);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
    updateBadge();

    const finish = (msg, success) => {
        closeModal('deleteModal');
        renderList();
        showToast(msg, success);
        btn.textContent = 'Yes, Delete'; btn.disabled = false;
    };

    if (!WEB_APP_URL) { finish('Deleted locally (no URL set).', false); return; }

    fetch(`${WEB_APP_URL}?action=delete&id=${encodeURIComponent(deletingId)}`)
        .then(r => r.json())
        .then(data => finish(data.status === 'success' ? '🗑️ Deleted from Google Sheets.' : '⚠️ Deleted locally only.', false))
        .catch(() => finish('🗑️ Deleted from Google Sheets.', false));
}

// ══════════════════════════════════════════
//  RENDER LIST
// ══════════════════════════════════════════
function setFilter(el) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    currentFilter = el.dataset.filter;
    renderList();
}

function renderList() {
    const container = document.getElementById('remindersList');
    const filtered  = currentFilter === 'all' ? reminders : reminders.filter(r => r.category === currentFilter);

    if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">${currentFilter === 'all' ? '🔔' : (CAT_ICONS[currentFilter]||'🔔')}</div><p>${currentFilter === 'all' ? 'No reminders yet. Create your first one!' : 'No reminders in this category.'}</p></div>`;
        return;
    }

    const sorted = [...filtered].sort((a,b) => new Date(a.date+'T'+a.time) - new Date(b.date+'T'+b.time));

    container.innerHTML = sorted.map(r => {
        const freqLabel = r.frequency === 'custom' ? `Every ${r.customDays} days` : (FREQ_LABELS[r.frequency] || r.frequency);
        const dateStr   = r.date ? new Date(r.date+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
        const timeStr   = r.time ? formatTime(r.time) : '';
        const isDone    = r.status === 'done';
        return `
        <div class="reminder-item${isDone?' status-done':''}" onclick="viewReminder('${r.id}')">
            <div class="reminder-item-top">
                <div class="reminder-item-left">
                    <div class="reminder-cat-icon">${CAT_ICONS[r.category]||'🔔'}</div>
                    <div>
                        <div class="reminder-title">${escHtml(r.title)}</div>
                        <div class="reminder-meta">📆 ${dateStr} &nbsp;⏰ ${timeStr}</div>
                        <div class="reminder-badges">
                            <span class="r-badge">${CAT_LABELS[r.category]||r.category}</span>
                            <span class="r-badge freq">${freqLabel}</span>
                            ${r.location ? `<span class="r-badge loc">📍 ${escHtml(r.location)}</span>`:''}
                            ${isDone ? `<span class="r-badge done">✅ Done</span>`:''}
                        </div>
                    </div>
                </div>
                <div class="item-actions" onclick="event.stopPropagation()">
                    <button class="icon-btn edit" onclick="openEdit('${r.id}')" title="Edit">✏️</button>
                    <button class="icon-btn del"  onclick="openDelete('${r.id}')" title="Delete">🗑️</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ══════════════════════════════════════════
//  VIEW MODAL
// ══════════════════════════════════════════
function viewReminder(id) {
    const r = reminders.find(x => x.id === id);
    if (!r) return;
    viewingId = id;
    const freqLabel = r.frequency === 'custom' ? `Every ${r.customDays} days` : (FREQ_LABELS[r.frequency]||r.frequency);
    const dateStr   = r.date ? new Date(r.date+'T00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) : '—';
    const timeStr   = r.time ? formatTime(r.time) : '—';
    document.getElementById('viewModalTitle').textContent = (CAT_ICONS[r.category]||'🔔') + ' ' + r.title;
    document.getElementById('viewModalBody').innerHTML = `
        <div class="detail-row"><span class="detail-icon">🏷️</span><div><div class="detail-key">Category</div><div class="detail-val">${CAT_LABELS[r.category]||r.category}</div></div></div>
        <div class="detail-row"><span class="detail-icon">📆</span><div><div class="detail-key">Date</div><div class="detail-val">${dateStr}</div></div></div>
        <div class="detail-row"><span class="detail-icon">⏰</span><div><div class="detail-key">Time</div><div class="detail-val">${timeStr}</div></div></div>
        <div class="detail-row"><span class="detail-icon">🔁</span><div><div class="detail-key">Frequency</div><div class="detail-val">${freqLabel}</div></div></div>
        <div class="detail-row"><span class="detail-icon">📊</span><div><div class="detail-key">Status</div><div class="detail-val">${r.status||'pending'}</div></div></div>
        ${r.location?`<div class="detail-row"><span class="detail-icon">📍</span><div><div class="detail-key">Location</div><div class="detail-val">${escHtml(r.location)}</div></div></div>`:''}
        ${r.notes?`<div class="detail-row"><span class="detail-icon">💬</span><div><div class="detail-key">Notes</div><div class="detail-val">${escHtml(r.notes)}</div></div></div>`:''}
    `;
    openModal('viewModal');
}

function editFromView() { closeModal('viewModal'); setTimeout(()=>openEdit(viewingId),120); }

// ══════════════════════════════════════════
//  EDIT MODAL
// ══════════════════════════════════════════
function openEdit(id) {
    const r = reminders.find(x => x.id === id);
    if (!r) return;
    editingId = id;
    document.getElementById('editTitle').value    = r.title;
    document.getElementById('editFrequency').value= r.frequency;
    document.getElementById('editDate').value     = r.date;
    document.getElementById('editTime').value     = r.time;
    document.getElementById('editLocation').value = r.location || '';
    document.getElementById('editNotes').value    = r.notes    || '';
    const cdDiv = document.getElementById('editCustomDaysDiv');
    cdDiv.style.display = r.frequency === 'custom' ? 'block' : 'none';
    document.getElementById('editCustomDays').value = r.customDays || '';
    document.querySelectorAll('#editModal .cat-btn').forEach(b => b.classList.toggle('active', b.dataset.value === r.category));
    document.getElementById('editCategory').value = r.category;
    openModal('editModal');
}

// ══════════════════════════════════════════
//  SHARED UI HELPERS
// ══════════════════════════════════════════
function selectCategory(btn, selectId) {
    // Find parent category-strip and deactivate siblings
    btn.closest('.category-strip').querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(selectId).value = btn.dataset.value;
}

function toggleCustomDays(divId, inputId, selectId) {
    const freq = document.getElementById(selectId).value;
    document.getElementById(divId).style.display = freq === 'custom' ? 'block' : 'none';
    if (freq !== 'custom') document.getElementById(inputId).value = '';
}

function resetForm() {
    ['title','date','time','location','notes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('frequency').value = 'none';
    document.getElementById('customDaysDiv').style.display = 'none';
    document.getElementById('customDays').value = '';
    document.querySelectorAll('#createPanel .cat-btn').forEach((b,i) => b.classList.toggle('active', i===0));
    document.getElementById('category').value = 'medicine';
}

function updateBadge() { document.getElementById('reminderCount').textContent = reminders.length; }

function showToast(msg, success = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
}

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
});

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatTime(t) {
    if (!t) return '';
    const [h,m] = t.split(':'); const hr = parseInt(h);
    return `${hr%12||12}:${m} ${hr>=12?'PM':'AM'}`;
}

init();
</script>
